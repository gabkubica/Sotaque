<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f3ec">
<title>Sotaque</title>
<link rel="icon" type="image/png" href="app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--paper:#f8f3ec;--surface:#fffcf7;--line:#e7ddd1;--ink:#221c1e;--ink-2:#5a4f52;--wine:#7a1f35}
@media (prefers-color-scheme:dark){:root{--paper:#1c1719;--surface:#262022;--line:#3a3134;--ink:#f3ebe4;--ink-2:#c4b8b2;--wine:#e08aa0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding:24px 16px}
main{width:min(520px,100%);display:flex;flex-direction:column;gap:14px}
h1{font:800 40px/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0}
p{margin:0 0 10px;color:var(--ink-2)}
a{display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-decoration:none}
a:hover{border-color:var(--wine)}
a b{display:block;font-size:18px}
a small{color:var(--ink-2)}
img{width:48px;height:48px;border-radius:12px;flex:none}
</style>
<main>
  <h1>Sotaque</h1>
  <p>Aulas particulares de inglês e francês.</p>
  <a href="app/"><img src="app/icon-192.png" alt=""><span><b>Entrar no Sotaque</b><small>Agenda, tarefas e trilha de cada aluno</small></span></a>
  <a href="site/"><img src="site/foto-alexia.jpg" alt="" style="object-fit:cover"><span><b>Teacher Lexi</b><small>Aulas de inglês com a Alexia</small></span></a>
  <a href="frances/"><img src="app/icon-192.png" alt="" style="filter:hue-rotate(195deg) saturate(1.2)"><span><b>Prof. Gabriel</b><small>Aulas de francês (em breve)</small></span></a>
</main>
</html>
