<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Au Pair · Sotaque</title>
<meta name="description" content="Treino para a entrevista de inglês do programa Au Pair.">
<meta name="theme-color" content="#fffaf2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../app/quadros.js"></script>
<script src="../app/aupair.js"></script>
<script src="motor.js"></script>
<script>
const base=new URL('.',location.href).href, link=p=>base+p;
const card=(t,d,href,send)=>`<div class="panel"><h2>${t}</h2><p class="meta" style="margin:0">${d}</p><div class="row"><a class="btn primary" href="${href}">Abrir</a>${send? `<button class="btn" data-copy="${link(href)}">Copiar link para a aluna</button>` : ''}</div></div>`;
document.getElementById('app').innerHTML=`${typeof quadro==='function'? `<div class="art">${quadro('ceu','aviao',3,{w:1000,h:200,frame:false,focus:[.6,.8],align:'xMaxYMid'})}</div>` : ''}
  <p class="eyebrow" style="margin-top:22px">Sotaque · Au Pair</p><h1 style="margin-top:6px">Treino para a entrevista</h1>
  <p class="meta">Preparação para a entrevista de inglês da agência de Au Pair: vida pessoal, inglês, crianças, situações e expectativas sobre os EUA. As tarefas da aula estão no banco do Sotaque, no tema “Au Pair”.</p>
  ${card('Lição de casa 1 · about you and kids','Vídeo de apresentação, vocabulário da rotina com crianças, gramática para falar de você e 5 perguntas da entrevista em áudio. Uns 25 minutos.','casa.html?dia=1',true)}
  ${card('Lição de casa 2 · situations and the USA','Ligação com uma host mom, situações com crianças, “I would…” e 5 perguntas da entrevista em áudio. Uns 25 minutos.','casa.html?dia=2',true)}
  ${card('Speaking · simulação da entrevista','42 perguntas por tema, com áudio, e um modo entrevista para fazer na aula, uma pergunta por vez.','fala.html',false)}
  ${card('Respostas recebidas','Onde abrem os links que a aluna manda. As lições que você abrir ficam guardadas neste aparelho.','respostas.html',false)}
  <footer>Sotaque · Au Pair</footer>`;
document.addEventListener('click',e=>{ const b=e.target.closest('[data-copy]'); if (!b) return; (navigator.clipboard? navigator.clipboard.writeText(b.dataset.copy) : Promise.reject()).then(()=>{ b.textContent='Link copiado!'; }).catch(()=>prompt('Copie o link:',b.dataset.copy)); });
</script>
</body>
</html>
